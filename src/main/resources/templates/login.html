<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Login</title>
    <script>
        function toRegister(){ window.location.href = '/register'; }
        function submitLogin(e){ if(!document.getElementById('email').value) { alert('Enter email'); e.preventDefault(); } }
    </script>
</head>
<body>
<h1>Employee Login</h1><div th:if="${error}" style="color:red;" th:text="${error}"></div>
<div th:if="${success}" style="color:green;" th:text="${success}"></div><form th:action="@{/login}" method="post" onsubmit="submitLogin(event)">
    <label>Email: <input id="email" type="email" name="email" required/></label><br/>
    <label>Password: <input type="password" name="password" required/></label><br/>
    <button type="submit">Login</button>
    <button type="button" onclick="toRegister()">Register</button>
</form></body>
</html>
